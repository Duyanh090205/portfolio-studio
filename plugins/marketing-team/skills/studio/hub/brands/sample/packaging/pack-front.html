<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>CEMMY: Pack front</title>
<link rel="stylesheet" href="../brand.css">
<link rel="stylesheet" href="../../../_system/layouts.css">
<script src="../../../_system/compose.js"></script>
<style>
  .frame { container-type: inline-size; }
  .net-badge {
    position: absolute; left: 50%; bottom: 6cqw; transform: translateX(-50%);
    background: var(--light); color: var(--primary);
    font-family: var(--font-body); font-weight: 700;
    font-size: 3.2cqw; letter-spacing: .04em;
    padding: 1.6cqw 4cqw; border-radius: 999px;
  }
  .variant-tag {
    font-family: var(--font-accent); color: var(--secondary);
    font-size: 5.5cqw; margin-top: 1cqw;
  }
</style>
</head><body>
<main class="frame" style="width:1200px;height:1500px">
  <div class="l-type t-primary">
    <div class="logo tl" data-logo="logo-reversed"></div>
    <i class="shape star" style="top:8cqw;right:10cqw"></i>
    <i class="shape sparkle" style="top:20cqw;left:8cqw"></i>
    <div class="copy">
      <p class="kicker">signature swirl</p>
      <h1 class="headline">Two Flavors.<br>One Star.</h1>
      <p class="sub">Strawberry &amp; blueberry, swirled for sharing.</p>
      <p class="variant-tag">Strawberry x Blueberry</p>
    </div>
    <div class="photo-layer"><img data-img="pk-product" class="photo" alt=""></div>
    <span class="net-badge">1 PINT · 473 ML</span>
  </div>
</main>
</body></html>
